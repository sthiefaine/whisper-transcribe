version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: transcriber-backend
    environment:
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/db/jobs.db
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - VOXTRAL_MODEL=voxtral-mini-latest
      - ENABLE_DIARIZATION=true
      - API_TIMEOUT=3600
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - transcriber-net

  frontend:
    build:
      context: ./frontend
    container_name: transcriber-frontend
    ports:
      - "8085:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - transcriber-net

networks:
  transcriber-net:
    driver: bridge
