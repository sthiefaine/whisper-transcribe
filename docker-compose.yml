version: '3.8'

services:
  scriberr:
    image: ghcr.io/rishikanthc/scriberr:latest
    container_name: scriberr
    # Port mapping retiré - Coolify gère le routing via Traefik
    # Le port interne reste 8080, Coolify le route automatiquement
    expose:
      - "8080"
    environment:
      - DB_PATH=/app/data/scriberr.db
      - UPLOAD_DIR=/app/data/uploads
      - HF_TOKEN=${HF_TOKEN:-}
      - PORT=8080
    volumes:
      - ./data:/app/data
    restart: always
    healthcheck:
      # Healthcheck avec fallback: curl ou wget
      # start_period augmenté à 5 minutes car le service télécharge des modèles au démarrage
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health 2>/dev/null || wget --no-verbose --tries=1 --spider http://localhost:8080/health 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # 5 minutes pour laisser le temps de télécharger les modèles
    networks:
      - coolify
    # IMPORTANT: Ne pas ajouter de labels Traefik manuels
    # Coolify gère automatiquement le routing via Traefik quand le domaine est configuré dans l'interface
    # Les labels manuels peuvent entrer en conflit avec la configuration automatique de Coolify
    # Option GPU NVIDIA (décommentez si vous avez une GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    stop_grace_period: 60s

networks:
  coolify:
    external: true
