version: '3.8'

services:
  whisper-api:
    build: .
    ports:
      - "8090:8080"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - PYTHONHASHSEED=random
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - whisper-models:/opt/whisper.cpp/models
      - ./logs:/var/log/whisper
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G   # Strict 8GB limit for large file transcription
          cpus: '2.5'  # Max 2.5 CPU cores as requested
        reservations:
          memory: 4G   
          cpus: '1.0'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s    # Augmenté de 30s à 60s
      timeout: 30s     # Augmenté de 10s à 30s
      retries: 5       # Augmenté de 3 à 5
      start_period: 120s  # Augmenté de 40s à 120s
    networks:
      - coolify
    # Configuration pour éviter les timeouts Coolify
    stop_grace_period: 300s  # 5 minutes pour arrêt gracieux
    stop_signal: SIGTERM

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "90:80"
      - "4443:443"
    depends_on:
      - whisper-api
    restart: unless-stopped 
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - coolify

networks:
  coolify:
    external: true

volumes:
  whisper-models: