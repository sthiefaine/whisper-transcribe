version: '3.8'

# Configuration pour déploiement Coolify/Hetzner
# Utilise le réseau Coolify pour le routing Traefik

services:
  backend:
    build:
      context: ./backend
    container_name: transcriber-backend
    expose:
      - "8000"
    environment:
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/db/jobs.db
      - CHECKPOINT_DB_PATH=/app/data/db/checkpoints.db
      - HF_TOKEN=${HF_TOKEN:-}
      - CHUNK_DURATION=300
      - MODEL_SIZE=large-v3
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
      - CPU_THREADS=4
    volumes:
      - ./data:/app/data
      - model-cache:/root/.cache/huggingface
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 14G
        reservations:
          memory: 4G
    networks:
      - coolify
    stop_grace_period: 120s

  frontend:
    build:
      context: ./frontend
    container_name: transcriber-frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: always
    networks:
      - coolify

volumes:
  model-cache:
    driver: local

networks:
  coolify:
    external: true
